# LoanPay lint policy. The custom rules below encode this codebase's
# architectural contracts — they exist so a reviewer never has to catch
# these by eye.

included:
  - loanpay
  - loanpayTests
  - Packages

excluded:
  - Packages/*/.build
  - .build

opt_in_rules:
  - file_name # filename must match the primary type — one type per file

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 300
  error: 400

type_name:
  max_length: 45

identifier_name:
  min_length: 2

file_name:
  # Files whose name legitimately differs from a single primary type.
  excluded:
    - loanpayApp.swift
    - LoanPayDomain.swift
    - TestSupport.swift
    - DataTestSupport.swift
    - AppTestSupport.swift
    - PaymentTestSupport.swift
    - SecurityTests.swift
    - SupportFeatureTests.swift
    - XCTestPrimer.swift
    - RosettaTests.swift

custom_rules:
  no_print_outside_debug:
    name: "No print in production code"
    regex: '^\s*print\('
    match_kinds: [identifier]
    included: '.*/(loanpay|Sources)/.*\.swift'
    excluded: '.*(Tests|Debug|ConsoleAnalytics).*'
    message: "print() ships to nobody's benefit — use AppLogger (categories, no-PII contract). DEBUG-only diagnostics belong behind #if DEBUG."
    severity: error

  no_localized_description_in_presentation:
    name: "No localizedDescription in presentation"
    regex: '\.localizedDescription'
    included: '.*/(Features|PaymentFeature|SupportFeature|FeatureKit)/.*\.swift'
    message: "Screens show DomainError.userMessage, never transport error text — localizedDescription leaks URLError prose to borrowers."
    severity: error

  no_userdefaults_in_data_or_session:
    name: "No UserDefaults in Data/Session"
    regex: 'UserDefaults'
    included: '.*/(LoanPayData/Sources|Auth)/.*\.swift'
    message: "UserDefaults is a plaintext plist. Tokens go in the Keychain; caches go through CacheStore; app-level debug switches live in the app target only."
    severity: error

  no_raw_money_text:
    name: "Money renders through AmountText"
    regex: 'Text\([a-zA-Z_.]*\.formatted\(\)\)'
    included: '.*/(Features|PaymentFeature|SupportFeature)/.*\.swift'
    message: "Amounts render through AmountText (formatted + spoken + privacySensitive); a raw Text(money.formatted()) drops two of the three."
    severity: warning
